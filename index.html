<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="食事・体重・筋トレ・サプリをまとめて記録する自分用アプリ。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script>
    // 見た目の設定を描画前に反映して、起動時のちらつきを防ぐ（正式な値は記録側にあり、読み込み後に上書きされる）。
    try { const a = JSON.parse(localStorage.getItem('form-appearance') || '{}'), r = document.documentElement;
      if (['light', 'dark'].includes(a.theme)) r.dataset.theme = a.theme;
      if (['blue', 'green', 'orange', 'red', 'purple'].includes(a.accent)) r.dataset.accent = a.accent; } catch {}
  </script>
  <title>Form — 食事とからだの記録</title>
</head>
<body>
  <div id="app"><p class="loading">記録を読み込んでいます…</p></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
